<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat anónimo · {{ room }}</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f232c;
      --text: #e6e8ec;
      --muted: #8b93a1;
      --accent: #4363d8;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .room-tag {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .me {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #262b36; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg { max-width: 75%; }
    .msg .who { font-size: 12px; margin-bottom: 2px; }
    .msg .bubble {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.35;
    }
    .msg .ts { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .msg.mine { align-self: flex-end; text-align: right; }
    .msg.mine .bubble {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .system {
      align-self: center;
      color: var(--muted);
      font-size: 12px;
      font-style: italic;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
    #text {
      flex: 1;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      resize: none;
      max-height: 120px;
      font-family: inherit;
    }
    #text:focus { outline: none; border-color: var(--accent); }
    .send-btn { background: var(--accent); border-color: var(--accent); color: white; padding: 0 18px; }
  </style>
</head>
<body>
  <header>
    <h1>💬 Chat anónimo</h1>
    <span class="room-tag">sala: {{ room }}</span>
    <button id="copiar" title="Copiar enlace de invitación">Invitar</button>
    <div class="me">
      <span class="dot" id="mecolor" style="background: {{ color }}"></span>
      <span id="mealias">{{ alias }}</span>
      <button id="regenerar" title="Aparecer como alguien nuevo">↻</button>
    </div>
  </header>

  <div id="messages">
    <div class="system">Estás en la sala «{{ room }}». Nadie sabe quién eres. Tu alias: {{ alias }}</div>
  </div>

  <form id="form">
    <textarea id="text" rows="1" placeholder="Escribe un mensaje anónimo…" autocomplete="off"></textarea>
    <button class="send-btn" type="submit">Enviar</button>
  </form>

  <script>
    const room = {{ room|tojson }};
    let lastId = 0;

    const box = document.getElementById('messages');
    const form = document.getElementById('form');
    const text = document.getElementById('text');

    // Recuperamos el pid de la sesión a partir del primer mensaje propio.
    // Como no lo exponemos directo, marcamos "mío" comparando al enviar.
    const sentIds = new Set();

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function render(m, mine) {
      const wrap = document.createElement('div');
      wrap.className = 'msg' + (mine ? ' mine' : '');
      wrap.innerHTML =
        '<div class="who" style="color:' + m.color + '">' + esc(m.alias) + '</div>' +
        '<div class="bubble">' + esc(m.text) + '</div>' +
        '<div class="ts">' + esc(m.ts) + '</div>';
      box.appendChild(wrap);
      box.scrollTop = box.scrollHeight;
    }

    async function poll() {
      try {
        const r = await fetch('/messages?room=' + encodeURIComponent(room) + '&since=' + lastId);
        const data = await r.json();
        for (const m of data.messages) {
          lastId = Math.max(lastId, m.id);
          render(m, sentIds.has(m.id));
        }
      } catch (e) { /* reintenta en el siguiente ciclo */ }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const t = text.value.trim();
      if (!t) return;
      text.value = '';
      const body = new URLSearchParams({ room, text: t });
      const r = await fetch('/send', { method: 'POST', body });
      const data = await r.json();
      if (data.ok) {
        sentIds.add(data.message.id);
      }
    });

    // Enter envía, Shift+Enter salto de línea.
    text.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    document.getElementById('copiar').addEventListener('click', async () => {
      const url = window.location.origin + '/?room=' + encodeURIComponent(room);
      try {
        await navigator.clipboard.writeText(url);
        const b = document.getElementById('copiar');
        b.textContent = '¡Copiado!';
        setTimeout(() => (b.textContent = 'Invitar'), 1500);
      } catch (e) {
        prompt('Copia este enlace e invítalo:', url);
      }
    });

    document.getElementById('regenerar').addEventListener('click', async () => {
      const r = await fetch('/nueva-identidad', { method: 'POST' });
      const data = await r.json();
      if (data.ok) {
        document.getElementById('mealias').textContent = data.alias;
        document.getElementById('mecolor').style.background = data.color;
      }
    });

    poll();
    setInterval(poll, 1500);
  </script>
</body>
</html>
