<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Chat anónimo · {{ room }}</title>
  <style>
    :root {
      --bg: #ffffff;
      --header-bg: rgba(249, 249, 249, 0.92);
      --border: #d1d1d6;
      --bubble-in: #e9e9eb;
      --bubble-in-text: #000000;
      --bubble-out: #0a84ff;
      --bubble-out-text: #ffffff;
      --muted-c: #8e8e93;
      --blue: #0a84ff;
      --red: #ff3b30;
      --gold: #ffb300;
      --field-bg: #ffffff;
      --popover-bg: #ffffff;
      --replybar-bg: #f7f7f8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: #000;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    /* --- Cabecera --- */
    header {
      flex: 0 0 auto;
      z-index: 10;
      background: var(--header-bg);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--border);
      padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px;
      display: flex; align-items: center; gap: 10px;
    }
    .title-wrap { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
    .title-wrap .t { font-size: 16px; font-weight: 600; }
    .title-wrap .sub { font-size: 12px; color: var(--muted-c); display: flex; gap: 8px; align-items: center; }
    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #34c759; display: inline-block; }
    .spacer { flex: 1; }
    .pill {
      background: #ececee; border-radius: 999px; padding: 3px 9px;
      font-size: 13px; color: #3a3a3c; white-space: nowrap;
    }
    .icon-btn {
      background: none; border: none; color: var(--blue);
      font-size: 15px; cursor: pointer; padding: 6px 8px; border-radius: 8px;
    }
    .icon-btn:hover { background: rgba(10,132,255,0.1); }
    .icon-btn:active { opacity: 0.5; }

    /* --- Banner de destacado --- */
    #goldBanner {
      display: none; align-items: center; gap: 8px;
      background: linear-gradient(90deg, #fff7e0, #fff);
      border-bottom: 0.5px solid var(--border);
      padding: 7px 14px; font-size: 13px; color: #7a5b00; cursor: pointer;
    }
    #goldBanner b { font-weight: 600; }
    #goldBanner .gtext { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* --- Mensajes --- */
    #messages {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 14px 12px 6px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .system { align-self: center; color: var(--muted-c); font-size: 12px; text-align: center; margin: 5px 20px; }

    .row { display: flex; flex-direction: column; max-width: 78%; }
    .row.in  { align-self: flex-start; align-items: flex-start; }
    .row.out { align-self: flex-end;   align-items: flex-end; }
    .row.fresh { margin-top: 10px; }

    .quote {
      font-size: 13px; color: var(--muted-c);
      border-left: 3px solid #c7c7cc; padding: 1px 8px; margin: 0 6px 3px;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .bubble {
      padding: 7px 13px; border-radius: 19px; font-size: 16px; line-height: 1.32;
      white-space: pre-wrap; overflow-wrap: break-word; position: relative; cursor: pointer;
    }
    .in  .bubble { background: var(--bubble-in);  color: var(--bubble-in-text); border-bottom-left-radius: 6px; }
    .out .bubble { background: var(--bubble-out); color: var(--bubble-out-text); border-bottom-right-radius: 6px; }
    .row.red .bubble  { background: linear-gradient(135deg, #ff5b52, #ff3b30) !important; color: #fff !important; }
    .row.gold .bubble { box-shadow: 0 0 0 2px var(--gold); }
    .flag { font-size: 11px; font-weight: 600; margin: 3px 10px 0; }
    .row.red .flag  { color: var(--red); }
    .row.gold .flag { color: #b37f00; }

    .reacts { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 8px 0; }
    .chip {
      background: #fff; border: 1px solid var(--border); border-radius: 999px;
      padding: 1px 7px; font-size: 12px; line-height: 1.5; cursor: pointer;
      display: inline-flex; gap: 3px; align-items: center; user-select: none;
    }
    .chip.mine { background: #dcecff; border-color: #a9d0ff; }
    .chip .cnt { color: #555; font-variant-numeric: tabular-nums; }
    .time { font-size: 11px; color: var(--muted-c); margin: 3px 12px 0; }

    /* --- Nota de voz --- */
    .bubble.voice { display: flex; align-items: center; gap: 8px; min-width: 168px; cursor: default; }
    .voice-play {
      flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; border: none;
      background: rgba(0,0,0,.08); color: inherit; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .out .voice-play { background: rgba(255,255,255,.25); }
    .voice-track { flex: 1; height: 4px; border-radius: 2px; background: rgba(0,0,0,.15); cursor: pointer; overflow: hidden; }
    .out .voice-track { background: rgba(255,255,255,.35); }
    .voice-fill { height: 100%; width: 0%; background: currentColor; border-radius: 2px; }
    .voice-time { flex: 0 0 auto; font-size: 12px; font-variant-numeric: tabular-nums; opacity: .85; }

    /* --- Popover de acciones (reactions + reply) --- */
    #popover {
      position: fixed; z-index: 50; display: none;
      background: var(--popover-bg); border: 1px solid var(--border); border-radius: 22px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.18); padding: 5px 8px;
      align-items: center; gap: 2px;
    }
    #popover button {
      border: none; background: none; font-size: 22px; cursor: pointer;
      padding: 3px 4px; border-radius: 50%; line-height: 1;
    }
    #popover button:hover { background: #f0f0f0; transform: scale(1.15); }
    #popover .divider { width: 1px; height: 24px; background: var(--border); margin: 0 3px; }
    #popover .reply-b { font-size: 16px; }

    /* --- Pie (typing + reply bar + composer) --- */
    footer { flex: 0 0 auto; border-top: 0.5px solid var(--border); background: var(--bg); padding-bottom: env(safe-area-inset-bottom, 0px); }
    #typing { font-size: 12px; color: var(--muted-c); padding: 4px 16px 0; min-height: 18px; }
    #replyBar {
      display: none; align-items: center; gap: 8px; padding: 6px 14px;
      border-top: 0.5px solid var(--border); background: var(--replybar-bg);
    }
    #replyBar .rb-text { flex: 1; font-size: 13px; color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid var(--blue); padding-left: 8px; }
    #replyBar .rb-x { cursor: pointer; color: var(--muted-c); font-size: 18px; padding: 0 4px; }

    #muteBar {
      display: none; align-items: center; justify-content: center; gap: 8px;
      background: #ffe5e3; color: var(--red); font-size: 14px; font-weight: 500;
      padding: 10px; border-top: 0.5px solid #ffb3ad;
    }
    #recordBar { display: none; align-items: center; gap: 8px; padding: 8px 10px; }
    .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); animation: recpulse 1s ease-in-out infinite; flex: 0 0 auto; }
    @keyframes recpulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    #recTime { font-size: 15px; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
    .rec-spacer { flex: 1; }
    #recCancel { flex: 0 0 auto; font-size: 20px; }

    .composer { display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px; }
    .field {
      flex: 1; display: flex; align-items: center; border: 1px solid var(--border);
      border-radius: 20px; background: var(--field-bg); padding: 5px 6px 5px 14px; min-height: 36px;
    }
    #text {
      flex: 1; border: none; outline: none; resize: none; font-size: 16px; line-height: 1.3;
      font-family: inherit; background: transparent; color: #000; max-height: 120px; padding: 3px 0;
    }
    .send {
      width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--blue);
      color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 auto; transition: background .15s, transform .1s; padding: 0;
    }
    .send:disabled { background: #c7c7cc; cursor: default; }
    .send:active:not(:disabled) { background: #0a6fd6; transform: scale(0.92); }
    .send svg { width: 18px; height: 18px; display: block; }
  </style>
</head>
<body>
  <header>
    <div class="title-wrap">
      <span class="t">Chat anónimo</span>
      <span class="sub"><span class="online-dot"></span><span id="online">1</span> en línea · # {{ room }}</span>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="cards" title="Tarjetas amarillas disponibles">🟨 3</span>
    <button class="icon-btn" id="copiar" type="button" title="Copiar enlace de invitación">Invitar</button>
  </header>

  <div id="goldBanner"><span>🥇</span><span class="gtext"><b>Destacado:</b> <span id="goldText"></span></span></div>

  <div id="messages">
    <div class="system">Estás en la sala «{{ room }}». Nadie sabe quién eres.</div>
  </div>

  <div id="popover"></div>

  <footer>
    <div id="typing"></div>
    <div id="replyBar">
      <div class="rb-text" id="rbText"></div>
      <span class="rb-x" id="rbCancel">✕</span>
    </div>
    <div id="muteBar">🔴 Tarjeta roja — no puedes escribir (<span id="muteCount">1:00</span>)</div>
    <div id="recordBar">
      <span class="rec-dot"></span>
      <span id="recTime">0:00</span>
      <span class="rec-spacer"></span>
      <button class="icon-btn" id="recCancel" type="button" aria-label="Cancelar nota de voz">✕</button>
      <button class="send" id="recSend" type="button" aria-label="Enviar nota de voz">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="composer" id="composerRow">
      <div class="field">
        <textarea id="text" rows="1" placeholder="Mensaje" autocomplete="off" enterkeyhint="send"></textarea>
      </div>
      <button class="send" id="sendBtn" type="button" aria-label="Grabar nota de voz">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </footer>

  <script>
    const room = {{ room|tojson }};
    const EMOJIS = ["❤️","😂","👍","😮","😢","🔥","🟨","🥇"];
    const VOICE_MAX_SECONDS = 60;
    let lastId = 0;
    let lastSide = null; // no hay alias; se usa solo para separar bloques por lado
    let replyingTo = null;
    let muteUntil = 0;

    const box = document.getElementById('messages');
    const text = document.getElementById('text');
    const sendBtn = document.getElementById('sendBtn');
    const popover = document.getElementById('popover');
    const nodes = new Map(); // id -> {row, reactsEl}

    const MIC_ICON = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">'
      + '<path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
      + '<path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const SEND_ICON = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">'
      + '<path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function fmtDur(s) {
      s = Math.max(0, Math.round(s || 0));
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    const esc = (s) => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

    function buildMessage(m) {
      if (m.kind === 'system') {
        const d = document.createElement('div');
        d.className = 'system';
        d.textContent = m.text;
        box.appendChild(d);
        return;
      }
      const side = m.is_mine ? 'out' : 'in';
      const fresh = (side !== lastSide) ? ' fresh' : '';
      lastSide = side;

      const row = document.createElement('div');
      row.className = 'row ' + side + fresh;
      row.dataset.id = m.id;
      row.dataset.quote = m.audio ? '🎤 Nota de voz' : m.text;

      let html = '';
      if (m.reply) html += '<div class="quote">↩︎ ' + esc(m.reply.text) + '</div>';
      html += m.audio ? '<div class="bubble voice"></div>' : '<div class="bubble">' + esc(m.text) + '</div>';
      html += '<div class="flag"></div>';
      html += '<div class="reacts"></div>';
      html += '<div class="time">' + esc(m.ts) + '</div>';
      row.innerHTML = html;

      const bubble = row.querySelector('.bubble');
      bubble.addEventListener('click', (e) => { e.stopPropagation(); openMenu(m.id, bubble); });
      if (m.audio) buildVoicePlayer(bubble, m.id, m.audio.dur);

      box.appendChild(row);
      nodes.set(m.id, { row, reactsEl: row.querySelector('.reacts') });
      applyState(m.id, m);
    }

    function buildVoicePlayer(bubble, id, fallbackDur) {
      bubble.innerHTML = '<button type="button" class="voice-play">▶</button>'
        + '<div class="voice-track"><div class="voice-fill"></div></div>'
        + '<span class="voice-time">' + fmtDur(fallbackDur) + '</span>';
      const playBtn = bubble.querySelector('.voice-play');
      const trackEl = bubble.querySelector('.voice-track');
      const fillEl = bubble.querySelector('.voice-fill');
      const timeEl = bubble.querySelector('.voice-time');
      let audio = null;

      function ensureAudio() {
        if (audio) return audio;
        audio = new Audio('/voice/' + id + '?room=' + encodeURIComponent(room));
        audio.preload = 'none';
        audio.addEventListener('timeupdate', () => {
          const dur = audio.duration || fallbackDur;
          fillEl.style.width = (dur ? (audio.currentTime / dur) * 100 : 0) + '%';
          timeEl.textContent = fmtDur(dur - audio.currentTime);
        });
        audio.addEventListener('ended', () => {
          audio.currentTime = 0;
          playBtn.textContent = '▶'; fillEl.style.width = '0%'; timeEl.textContent = fmtDur(fallbackDur);
        });
        return audio;
      }
      playBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        ensureAudio();
        if (audio.paused) {
          audio.play()
            .then(() => { playBtn.textContent = '⏸'; })
            .catch(() => { flash('No se pudo reproducir la nota de voz'); });
        } else {
          audio.pause();
          playBtn.textContent = '▶';
        }
      });
      trackEl.addEventListener('click', (e) => {
        e.stopPropagation();
        ensureAudio();
        const r = trackEl.getBoundingClientRect();
        const pct = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        if (audio.duration) audio.currentTime = pct * audio.duration;
      });
    }

    function applyState(id, s) {
      const n = nodes.get(id);
      if (!n) return;
      // Reactions
      n.reactsEl.innerHTML = '';
      for (const emo of EMOJIS) {
        const c = s.reactions[emo];
        if (!c) continue;
        const chip = document.createElement('span');
        chip.className = 'chip' + (s.mine.includes(emo) ? ' mine' : '');
        chip.innerHTML = emo + '<span class="cnt">' + c + '</span>';
        chip.addEventListener('click', (e) => { e.stopPropagation(); react(id, emo); });
        n.reactsEl.appendChild(chip);
      }
      // Estatus (roja / dorada)
      n.row.classList.toggle('red', s.status === 'red');
      n.row.classList.toggle('gold', s.status === 'gold');
      const flag = n.row.querySelector('.flag');
      flag.textContent = s.status === 'red' ? '🔴 Tarjeta roja'
                       : s.status === 'gold' ? '🥇 Destacado' : '';
    }

    function openMenu(id, anchor) {
      const r = anchor.getBoundingClientRect();
      popover.innerHTML = '';
      for (const emo of EMOJIS) {
        const b = document.createElement('button');
        b.textContent = emo;
        b.title = emo === '🟨' ? 'Tarjeta amarilla' : emo === '🥇' ? 'Tarjeta dorada' : '';
        b.addEventListener('click', (e) => { e.stopPropagation(); react(id, emo); closeMenu(); });
        popover.appendChild(b);
      }
      const div = document.createElement('span'); div.className = 'divider'; popover.appendChild(div);
      const rb = document.createElement('button'); rb.className = 'reply-b'; rb.textContent = '↩︎'; rb.title = 'Responder';
      rb.addEventListener('click', (e) => { e.stopPropagation(); startReply(id); closeMenu(); });
      popover.appendChild(rb);

      popover.style.display = 'flex';
      const pw = popover.offsetWidth, ph = popover.offsetHeight;
      let left = Math.min(Math.max(8, r.left), window.innerWidth - pw - 8);
      let top = r.top - ph - 8;
      if (top < 8) top = r.bottom + 8;
      popover.style.left = left + 'px';
      popover.style.top = top + 'px';
    }
    function closeMenu() { popover.style.display = 'none'; }
    document.addEventListener('click', closeMenu);
    box.addEventListener('scroll', closeMenu);

    async function react(id, emoji) {
      const body = new URLSearchParams({ room, id, emoji });
      try {
        const r = await fetch('/react', { method: 'POST', body });
        const data = await r.json();
        if (typeof data.cards === 'number') setCards(data.cards);
        if (!data.ok && data.error === 'sin tarjetas') flash('Sin tarjetas 🟨 (vuelven en unos min)');
      } catch (e) {}
    }

    function startReply(id) {
      const n = nodes.get(id);
      const t = n ? n.row.dataset.quote : '';
      replyingTo = id;
      document.getElementById('rbText').textContent = '↩︎ ' + t;
      document.getElementById('replyBar').style.display = 'flex';
      text.focus();
    }
    function cancelReply() { replyingTo = null; document.getElementById('replyBar').style.display = 'none'; }
    document.getElementById('rbCancel').addEventListener('click', cancelReply);

    async function enviar() {
      if (Date.now() < muteUntil) return;
      const t = text.value.trim();
      if (!t) return;
      text.value = ''; autosize(); updateSendState();
      const body = new URLSearchParams({ room, text: t });
      if (replyingTo) body.set('reply_to', replyingTo);
      cancelReply();
      try {
        const r = await fetch('/send', { method: 'POST', body });
        if (r.status === 403) { const d = await r.json(); if (d.muted) applyMute(d.muted); }
      } catch (e) {}
    }

    text.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
    });
    sendBtn.addEventListener('click', () => {
      if (text.value.trim()) enviar();
      else startRecording();
    });

    let lastTyping = 0;
    function autosize() { text.style.height = 'auto'; text.style.height = Math.min(text.scrollHeight, 120) + 'px'; }
    function updateSendState() {
      sendBtn.disabled = Date.now() < muteUntil;
      sendBtn.innerHTML = text.value.trim() ? SEND_ICON : MIC_ICON;
      sendBtn.setAttribute('aria-label', text.value.trim() ? 'Enviar' : 'Grabar nota de voz');
    }
    text.addEventListener('input', () => {
      autosize(); updateSendState();
      const now = Date.now();
      if (now - lastTyping > 2000) { lastTyping = now; fetch('/typing', { method: 'POST', body: new URLSearchParams({ room }) }).catch(() => {}); }
    });

    // --- Notas de voz ---------------------------------------------------------
    let mediaRecorder = null, mediaChunks = [], mediaStream = null, recStart = 0, recTimer = null, recMime = '';

    function pickMime() {
      if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
      for (const o of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus']) {
        if (MediaRecorder.isTypeSupported(o)) return o;
      }
      return '';
    }

    async function startRecording() {
      if (Date.now() < muteUntil) return;
      if (!navigator.mediaDevices || !window.MediaRecorder) { flash('Tu navegador no soporta notas de voz'); return; }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        flash('No se pudo acceder al micrófono'); return;
      }
      mediaStream = stream;
      recMime = pickMime();
      mediaChunks = [];
      mediaRecorder = new MediaRecorder(stream, recMime ? { mimeType: recMime } : undefined);
      mediaRecorder.addEventListener('dataavailable', (e) => { if (e.data && e.data.size > 0) mediaChunks.push(e.data); });
      mediaRecorder.start();
      recStart = Date.now();
      document.getElementById('composerRow').style.display = 'none';
      document.getElementById('recordBar').style.display = 'flex';
      tickRecTime();
      recTimer = setInterval(tickRecTime, 250);
    }

    function tickRecTime() {
      const secs = (Date.now() - recStart) / 1000;
      document.getElementById('recTime').textContent = fmtDur(secs);
      if (secs >= VOICE_MAX_SECONDS) finishRecording();
    }

    function stopTracks() {
      if (mediaStream) { mediaStream.getTracks().forEach((t) => t.stop()); mediaStream = null; }
    }

    function resetRecordUI() {
      clearInterval(recTimer); recTimer = null;
      document.getElementById('recordBar').style.display = 'none';
      document.getElementById('composerRow').style.display = 'flex';
      document.getElementById('recTime').textContent = '0:00';
    }

    function cancelRecording() {
      if (!mediaRecorder) return;
      mediaRecorder.onstop = stopTracks;
      mediaChunks = [];
      if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      mediaRecorder = null;
      resetRecordUI();
    }

    function finishRecording() {
      if (!mediaRecorder) return;
      const dur = (Date.now() - recStart) / 1000;
      const mime = recMime || 'audio/webm';
      mediaRecorder.onstop = async () => {
        stopTracks();
        const chunks = mediaChunks;
        mediaRecorder = null;
        resetRecordUI();
        if (!chunks.length) return;
        const blob = new Blob(chunks, { type: mime });
        const fd = new FormData();
        fd.append('room', room);
        fd.append('dur', dur.toFixed(1));
        fd.append('audio', blob, 'voice');
        if (replyingTo) fd.append('reply_to', replyingTo);
        cancelReply();
        try {
          const r = await fetch('/voice', { method: 'POST', body: fd });
          if (r.status === 403) { const d = await r.json(); if (d.muted) applyMute(d.muted); }
          else if (!r.ok) { flash('No se pudo enviar la nota de voz'); }
        } catch (e) { flash('No se pudo enviar la nota de voz'); }
      };
      if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    }

    document.getElementById('recCancel').addEventListener('click', cancelRecording);
    document.getElementById('recSend').addEventListener('click', finishRecording);

    function setCards(n) { document.getElementById('cards').textContent = '🟨 ' + n; }

    function applyMute(secs) {
      muteUntil = Date.now() + secs * 1000;
      updateSendState();
    }
    function tickMute() {
      const bar = document.getElementById('muteBar');
      const remain = Math.max(0, Math.ceil((muteUntil - Date.now()) / 1000));
      if (remain > 0) {
        bar.style.display = 'flex';
        text.disabled = true;
        const mm = Math.floor(remain / 60), ss = String(remain % 60).padStart(2, '0');
        document.getElementById('muteCount').textContent = mm + ':' + ss;
      } else {
        bar.style.display = 'none';
        text.disabled = false;
      }
      updateSendState();
    }
    setInterval(tickMute, 250);

    let flashTimer = null;
    function flash(msg) {
      const t2 = document.getElementById('typing');
      t2.textContent = msg;
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => { t2.textContent = ''; }, 2500);
    }

    async function poll() {
      try {
        const r = await fetch('/state?room=' + encodeURIComponent(room) + '&since=' + lastId);
        const data = await r.json();
        for (const m of data.new) { lastId = Math.max(lastId, m.id); buildMessage(m); }
        for (const u of data.upd) applyState(u.id, u);
        document.getElementById('online').textContent = data.online;
        setCards(data.cards);
        if (data.muted > 0 && Date.now() >= muteUntil) applyMute(data.muted);
        const typEl = document.getElementById('typing');
        if (!flashTimer || typEl.textContent === '') {
          typEl.textContent = data.typing === 1 ? 'Alguien está escribiendo…'
                            : data.typing > 1 ? 'Varios están escribiendo…' : '';
        }
        const gb = document.getElementById('goldBanner');
        if (data.gold) { gb.style.display = 'flex'; document.getElementById('goldText').textContent = data.gold.text; }
        else gb.style.display = 'none';
      } catch (e) {}
    }

    document.getElementById('copiar').addEventListener('click', async () => {
      const url = window.location.origin + '/?room=' + encodeURIComponent(room);
      const b = document.getElementById('copiar');
      try { await navigator.clipboard.writeText(url); b.textContent = '¡Copiado!'; setTimeout(() => (b.textContent = 'Invitar'), 1500); }
      catch (e) { prompt('Copia este enlace e invítalo:', url); }
    });

    text.focus();
    poll();
    setInterval(poll, 1500);
  </script>
</body>
</html>
